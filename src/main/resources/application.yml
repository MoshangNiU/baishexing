server:
  port: 9527

spring:
  application:
    name: yunlan-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:mysql://localhost:3306/yunlan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: 031500linyu
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  openapi:
    title: 百社兴 API
    description: 百社兴后端服务接口文档
    version: 1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.yunlan.controller

yunlan:
  jwt:
    secret: yunlan-jwt-secret-key-2024-very-secure
    expire: 86400000
  wechat:
    appid: wxd9a4e65fe0c9b67c
    secret: 653fb91360c82a504be35920f49e36db
    pay:
      app-id: wxd9a4e65fe0c9b67c
      mch-id: "${WX_MCH_ID:your-mch-id}"
      api-v3-key: "${WX_API_V3_KEY:your-api-v3-key}"
      private-key-path: "${WX_PRIVATE_KEY_PATH:wechat/apiclient_key.pem}"
      notify-url: "${WX_NOTIFY_URL:https://your-domain.com/pay/notify}"
      domain: "${WX_DOMAIN:https://your-domain.com}"
      # 商户API证书序列号
      # 获取方式：登录微信支付商户平台 → 账户中心 → API安全 → 查看证书
      # 或使用 openssl x509 -in apiclient_cert.pem -noout -serial 命令查看
      mch-serial-no: "${WX_MCH_SERIAL_NO:your-mch-serial-no}"

amap:
  key: "${AMAP_KEY:你的高德地图Web服务API Key}"
  # 从 https://lbs.amap.com/ 注册获取，选择"Web服务"类型
  # 建议通过环境变量 AMAP_KEY 设置，避免明文配置

# 文件上传配置
upload:
  # 存储方式：local=本地存储, oss=阿里云OSS（后期可切换）
  storage: local
  # 本地存储绝对路径（Windows），Linux 改为 /data/baishexing/uploads
  path: F:/dev_project/baishexing_v3/uploads
  # 访问 URL 前缀
  url-prefix: /uploads
  # 允许的文件类型
  allowed-types: image/jpeg,image/png,image/gif,image/webp
  # 单文件最大大小（MB）
  max-size: 20

aliyun:
  oss:
    endpoint: "${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}"
    access-key-id: "${OSS_ACCESS_KEY_ID:your-access-key-id}"
    access-key-secret: "${OSS_ACCESS_KEY_SECRET:your-access-key-secret}"
    bucket-name: "${OSS_BUCKET_NAME:baishexing}"
    domain: "${OSS_DOMAIN:https://baishexing-images.oss-cn-hangzhou.aliyuncs.com}"
  # 阿里云 OSS 配置建议通过环境变量设置：
  #   OSS_ENDPOINT, OSS_ACCESS_KEY_ID, OSS_ACCESS_KEY_SECRET, OSS_BUCKET_NAME, OSS_DOMAIN
