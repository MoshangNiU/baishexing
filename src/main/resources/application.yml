server:
  port: 9527

spring:
  application:
    name: yunlan-backend
  datasource:
    url: jdbc:mysql://localhost:3306/yunlan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: 031500linyu
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  openapi:
    title: 百社兴 API
    description: 百社兴后端服务接口文档
    version: 1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.yunlan.controller

yunlan:
  jwt:
    secret: yunlan-jwt-secret-key-2024-very-secure
    expire: 86400000
  wechat:
    appid: wxd9a4e65fe0c9b67c
    secret: 653fb91360c82a504be35920f49e36db

amap:
  key: "${AMAP_KEY:你的高德地图Web服务API Key}"
  # 从 https://lbs.amap.com/ 注册获取，选择"Web服务"类型
  # 建议通过环境变量 AMAP_KEY 设置，避免明文配置

aliyun:
  oss:
    endpoint: "${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}"
    access-key-id: "${OSS_ACCESS_KEY_ID:your-access-key-id}"
    access-key-secret: "${OSS_ACCESS_KEY_SECRET:your-access-key-secret}"
    bucket-name: "${OSS_BUCKET_NAME:baishexing}"
    domain: "${OSS_DOMAIN:https://baishexing-images.oss-cn-hangzhou.aliyuncs.com}"
  # 阿里云 OSS 配置建议通过环境变量设置：
  #   OSS_ENDPOINT, OSS_ACCESS_KEY_ID, OSS_ACCESS_KEY_SECRET, OSS_BUCKET_NAME, OSS_DOMAIN
