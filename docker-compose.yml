services:
  mysql:
    image: mysql:8.0
    container_name: yunlan-mysql
    environment:
      MYSQL_ROOT_PASSWORD: yunlan123456
      MYSQL_DATABASE: yunlan
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_general_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./sql/migration.sql:/docker-entrypoint-initdb.d/02-migration.sql
      - ./sql/migration_v2.sql:/docker-entrypoint-initdb.d/03-migration_v2.sql
      - ./sql/migration_v3.sql:/docker-entrypoint-initdb.d/04-migration_v3.sql
      - ./sql/migration_v4.sql:/docker-entrypoint-initdb.d/05-migration_v4.sql
      - ./sql/migration_v5.sql:/docker-entrypoint-initdb.d/06-migration_v5.sql
      - ./sql/migration_v6.sql:/docker-entrypoint-initdb.d/07-migration_v6.sql
      - ./sql/seed_worker.sql:/docker-entrypoint-initdb.d/08-seed_worker.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pyunlan123456"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yunlan-backend
    ports:
      - "9527:9527"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=yunlan
      - DB_USERNAME=root
      - DB_PASSWORD=yunlan123456
      - AMAP_KEY=${AMAP_KEY}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET}
      - OSS_BUCKET_NAME=${OSS_BUCKET_NAME:-baishexing}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-oss-cn-hangzhou.aliyuncs.com}
      - OSS_DOMAIN=${OSS_DOMAIN}
      - JWT_SECRET=${JWT_SECRET:-yunlan-jwt-secret-prod-default}
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

volumes:
  mysql-data:
